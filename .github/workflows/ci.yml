name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (production deps fail on high/critical; all deps report only)
        run: npm audit --omit=dev --audit-level=high && (npm audit || true)
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: npm audit (production deps fail on high/critical; all deps report only)
        run: npm audit --omit=dev --audit-level=high && (npm audit || true)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm pack --dry-run

  python:
    # ubuntu-latest (26.04) has no Python 3.9 builds; 24.04 still has them.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Tool versions pinned in .github/requirements-ci.txt (they also pin the ruff of the dev extra).
      - run: python -m pip install -e ".[dev]" twine pip-audit -c ../.github/requirements-ci.txt
      - name: pip-audit (runtime deps; dev environment report only)
        run: python -m pip_audit . && (python -m pip_audit || true)
      - run: python -m pytest
      - run: python -m mypy --strict
        if: matrix.python-version != '3.9'
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m build && python -m twine check --strict dist/*

  secrets:
    # Secret scan over the full history. Image pinned by version and digest; no third-party action.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact --verbose --no-banner --exit-code 1

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # sdk/src (typechecked with the examples) imports the SDK's own dependencies (jose, canonicalize).
      - run: npm --prefix sdk ci
      - run: npm run typecheck:examples
      - run: npm run test:examples
      # Own package.json and tsconfig each, as in their READMEs.
      - name: Identity examples (Better Auth, Auth.js, headless relying party)
        run: npm --prefix examples/identity ci && npm --prefix examples/identity run typecheck
      - name: Agent messaging examples (two agents)
        run: npm --prefix examples/asim ci && npm --prefix examples/asim run typecheck

  guide-examples:
    # examples/guides: the runnable copies of agentboxd.com/guides (own package.json and tsconfig).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/guides
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run n8n:check
      - run: npm run openclaw:check
      - run: python -m pip install ruff -c ../../.github/requirements-ci.txt
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m py_compile langchain-email-tool/*.py crewai-email-agent/*.py openai-agents-sdk-email/*.py agent-self-signup/*.py
